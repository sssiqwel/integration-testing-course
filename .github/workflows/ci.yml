name: API tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHON: python
      PORT: "8765"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check exported OpenAPI spec
        run: |
          python scripts/export_openapi.py
          git diff --exit-code openapi/openapi.json

      - name: Start API server
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port $PORT > server.log 2>&1 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:$PORT/health && break; sleep 0.2; done

      - name: pytest
        run: python -m pytest

      - name: Newman (Postman collection)
        if: success() || failure()
        run: make newman PYTHON=python

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            server.log
